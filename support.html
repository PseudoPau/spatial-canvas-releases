<title>Spatial Canvas 安装与反馈</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<h1>安装与反馈</h1>
<h2>安装</h2>
<p>下载 Chromium ZIP，解压后在 Edge 的 <code>edge://extensions</code> 或 Chrome 的 <code>chrome://extensions</code> 开启开发人员模式，选择“加载解压缩的扩展”，选中含 <code>manifest.json</code> 的文件夹。</p>
<h2>升级</h2>
<p>升级前先在扩展内导出 JSON。覆盖旧文件后点击“重新加载”，不要先卸载扩展。开发者模式安装和商店安装可能拥有不同的扩展 ID，必要时使用导出 / 导入迁移。</p>
<h2>反馈</h2>
<p>请提供浏览器、扩展版本、复现步骤和是否可以稳定复现。不要在 Issue 中贴出真实网址、笔记或其他私人浏览内容。</p>
