<p><a href="https://github.com/PseudoPau/spatial-canvas-releases/releases">下载预览版</a> · <a href="privacy.html">隐私政策</a> · <a href="support.html">安装与反馈</a></p>
<p>先找到上次的问题，再打开完整路径。关闭页面会保留历史步骤，清理才移除记录；笔记、标签和手动关联帮助留下值得继续的线索。</p>
<p>核心功能免费。目前只提供 Chromium 预览包，尚未上架商店。AI 使用本地规则建议，未接入远程模型。</p>
